<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant d'Examen Camerounais AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">
    <div id="root" class="w-full max-w-2xl"></div>

    <script type="text/babel">
        const API_URL = '../../api/endpoints';

        const translations = {
            fr: {
                title: "Assistant IA Examens Camerounais",
                subtitle: "Préparation interactive au BAC, Probatoire & BEPC",
                loginTitle: "Connexion Élève / Candidate",
                registerTitle: "Créer un compte",
                username: "Nom d'utilisateur",
                password: "Mot de passe",
                loginBtn: "Se connecter",
                registerBtn: "S'inscrire",
                toggleToRegister: "Pas encore de compte ? S'inscrire",
                toggleToLogin: "Déjà un compte ? Se connecter",
                examSelect: "Sélectionnez l'Examen",
                subjectSelect: "Sélectionnez la Matière",
                chatPlaceholder: "Posez votre question sur les épreuves ou cours...",
                sendBtn: "Envoyer",
                you: "Vous",
                bot: "Assistant IA",
                logout: "Déconnexion",
                loading: "Chargement des examens...",
                noSubject: "-- Choisir une matière --",
                noExam: "-- Choisir un examen --"
            },
            en: {
                title: "Cameroon Exam AI Assistant",
                subtitle: "Interactive preparation for BAC, Probatoire & BEPC",
                loginTitle: "Student Login",
                registerTitle: "Create an Account",
                username: "Username",
                password: "Password",
                loginBtn: "Log In",
                registerBtn: "Register",
                toggleToRegister: "Don't have an account? Register",
                toggleToLogin: "Already have an account? Log In",
                examSelect: "Select Exam",
                subjectSelect: "Select Subject",
                chatPlaceholder: "Ask your question about exams or courses...",
                sendBtn: "Send",
                you: "You",
                bot: "AI Assistant",
                logout: "Log Out",
                loading: "Loading exams...",
                noSubject: "-- Select Subject --",
                noExam: "-- Select Exam --"
            }
        };

        function App() {
            const [lang, setLang] = React.useState('fr');
            const [token, setToken] = React.useState(localStorage.getItem('token') || null);
            const [username, setUsername] = React.useState(localStorage.getItem('username') || '');
            const [isRegistering, setIsRegistering] = React.useState(false);

            const [inputUser, setInputUser] = React.useState('');
            const [inputPass, setInputPass] = React.useState('');
            const [authError, setAuthError] = React.useState('');

            const [exams, setExams] = React.useState([]);
            const [selectedExam, setSelectedExam] = React.useState('');
            const [selectedSubject, setSelectedSubject] = React.useState('');
            const [message, setMessage] = React.useState('');
            const [chatLog, setChatLog] = React.useState([]);
            const [loadingChat, setLoadingChat] = React.useState(false);

            const t = translations[lang];

            React.useEffect(() => {
                fetch(`${API_URL}/exams.php`)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) setExams(data);
                    })
                    .catch(err => console.error(err));
            }, []);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                const action = isRegistering ? 'register' : 'login';
                try {
                    const res = await fetch(`${API_URL}/auth.php?action=${action}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: inputUser, password: inputPass })
                    });
                    const data = await res.json();
                    if (isRegistering) {
                        if (res.ok) {
                            setIsRegistering(false);
                            alert(lang === 'fr' ? 'Inscription réussie! Veuillez vous connecter.' : 'Registration successful! Please login.');
                        } else {
                            setAuthError(data.error || 'Registration failed');
                        }
                    } else {
                        if (data.token) {
                            setToken(data.token);
                            setUsername(data.username || inputUser);
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('username', data.username || inputUser);
                        } else {
                            setAuthError(data.error || 'Login failed');
                        }
                    }
                } catch (err) {
                    setAuthError('Connection error');
                }
            };

            const handleLogout = () => {
                setToken(null);
                setUsername('');
                localStorage.removeItem('token');
                localStorage.removeItem('username');
            };

            const handleSend = async () => {
                if (!message.trim() || loadingChat) return;
                const userMsg = message;
                setMessage('');
                setChatLog(prev => [...prev, { user: userMsg, bot: '...' }]);
                setLoadingChat(true);

                try {
                    const res = await fetch(`${API_URL}/chat.php`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            message: userMsg,
                            exam_id: selectedExam,
                            subject_id: selectedSubject,
                            language: lang
                        })
                    });
                    const data = await res.json();
                    setChatLog(prev => prev.map((item, idx) =>
                        idx === prev.length - 1 ? { user: userMsg, bot: data.response || 'Error' } : item
                    ));
                } catch (err) {
                    setChatLog(prev => prev.map((item, idx) =>
                        idx === prev.length - 1 ? { user: userMsg, bot: 'Network error' } : item
                    ));
                } finally {
                    setLoadingChat(false);
                }
            };

            const currentExamObj = exams.find(e => String(e.id) === String(selectedExam));

            return (
                <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-green-600 via-red-600 to-yellow-500 p-4 text-white flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <i className="fa-solid fa-graduation-cap text-3xl"></i>
                            <div>
                                <h1 className="text-xl font-bold">{t.title}</h1>
                                <p className="text-xs opacity-90">{t.subtitle}</p>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <button
                                onClick={() => setLang(lang === 'fr' ? 'en' : 'fr')}
                                className="bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-sm transition">
                                <i className="fa-solid fa-globe mr-1"></i> {lang === 'fr' ? 'English' : 'Français'}
                            </button>
                            {token && (
                                <button
                                    onClick={handleLogout}
                                    className="bg-black/30 hover:bg-black/50 text-white px-3 py-1 rounded-full text-xs font-semibold transition">
                                    <i className="fa-solid fa-right-from-bracket mr-1"></i> {t.logout}
                                </button>
                            )}
                        </div>
                    </div>

                    {!token ? (
                        /* Login / Register Form */
                        <div className="p-8 max-w-md mx-auto">
                            <h2 className="text-2xl font-bold text-center text-slate-700 mb-6">
                                {isRegistering ? t.registerTitle : t.loginTitle}
                            </h2>

                            {authError && (
                                <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200">
                                    {authError}
                                </div>
                            )}

                            <form onSubmit={handleAuth} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">{t.username}</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-user absolute left-3 top-3.5 text-slate-400"></i>
                                        <input
                                            type="text"
                                            required
                                            value={inputUser}
                                            onChange={e => setInputUser(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none"
                                            placeholder="ex: paul_biya"
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-1">{t.password}</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-lock absolute left-3 top-3.5 text-slate-400"></i>
                                        <input
                                            type="password"
                                            required
                                            value={inputPass}
                                            onChange={e => setInputPass(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none"
                                            placeholder="••••••••"
                                        />
                                    </div>
                                </div>
                                <button
                                    type="submit"
                                    className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
                                    {isRegistering ? t.registerBtn : t.loginBtn}
                                </button>
                            </form>

                            <div className="mt-6 text-center">
                                <button
                                    onClick={() => { setIsRegistering(!isRegistering); setAuthError(''); }}
                                    className="text-sm text-green-700 hover:underline font-medium">
                                    {isRegistering ? t.toggleToLogin : t.toggleToRegister}
                                </button>
                            </div>
                        </div>
                    ) : (
                        /* Main Chat Interface */
                        <div className="p-6 flex flex-col h-[550px]">
                            {/* Exam & Subject Selectors */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
                                        <i className="fa-solid fa-file-signature text-green-600 mr-1"></i> {t.examSelect}
                                    </label>
                                    <select
                                        value={selectedExam}
                                        onChange={e => { setSelectedExam(e.target.value); setSelectedSubject(''); }}
                                        className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-green-500 focus:outline-none">
                                        <option value="">{t.noExam}</option>
                                        {exams.map(ex => (
                                            <option key={ex.id} value={ex.id}>{ex.name} - {ex.description}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
                                        <i className="fa-solid fa-book-open text-red-600 mr-1"></i> {t.subjectSelect}
                                    </label>
                                    <select
                                        value={selectedSubject}
                                        onChange={e => setSelectedSubject(e.target.value)}
                                        disabled={!selectedExam}
                                        className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-green-500 focus:outline-none disabled:opacity-50">
                                        <option value="">{t.noSubject}</option>
                                        {currentExamObj && currentExamObj.subjects.map(sub => (
                                            <option key={sub.id} value={sub.id}>{sub.name}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Chat Messages Log */}
                            <div className="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-4 overflow-y-auto space-y-4">
                                {chatLog.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400">
                                        <i className="fa-regular fa-comments text-4xl mb-2"></i>
                                        <p className="text-sm font-medium">
                                            {lang === 'fr' ? 'Sélectionnez un examen et posez votre première question !' : 'Select an exam and ask your first question!'}
                                        </p>
                                    </div>
                                ) : (
                                    chatLog.map((chat, idx) => (
                                        <div key={idx} className="space-y-2">
                                            {/* User message */}
                                            <div className="flex justify-end">
                                                <div className="bg-green-600 text-white rounded-2xl rounded-tr-none px-4 py-2 max-w-[80%] text-sm shadow-sm">
                                                    <p className="font-semibold text-xs opacity-80 mb-0.5">{t.you}</p>
                                                    <p>{chat.user}</p>
                                                </div>
                                            </div>
                                            {/* Bot message */}
                                            <div className="flex justify-start">
                                                <div className="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-tl-none px-4 py-2 max-w-[85%] text-sm shadow-sm">
                                                    <p className="font-semibold text-xs text-yellow-600 mb-0.5 flex items-center">
                                                        <i className="fa-solid fa-robot mr-1"></i> {t.bot}
                                                    </p>
                                                    <p className="whitespace-pre-wrap">{chat.bot}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            {/* Input Area */}
                            <div className="mt-4 flex space-x-2">
                                <input
                                    type="text"
                                    value={message}
                                    onChange={e => setMessage(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleSend()}
                                    placeholder={t.chatPlaceholder}
                                    className="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-green-500 focus:outline-none"
                                />
                                <button
                                    onClick={handleSend}
                                    disabled={loadingChat || !message.trim()}
                                    className="bg-green-600 hover:bg-green-700 disabled:opacity-50 text-white px-6 py-3 rounded-xl font-bold transition flex items-center space-x-2">
                                    <span>{t.sendBtn}</span>
                                    <i className="fa-solid fa-paper-plane text-xs"></i>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
